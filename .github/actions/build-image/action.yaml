name: Build Image
description: Build once and push an immutable, SHA-addressed image to ghcr.io

inputs:
  context:
    required: true
  image:
    required: true
  tag:
    description: Additional pointer tag (e.g. stage-<run id>) used for promotion
    required: true
  registry-username:
    required: true
  registry-token:
    required: true

outputs:
  digest:
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:sha-${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ inputs.tag }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}
