name: Build Image
description: Build and push a Docker image to ghcr.io

inputs:
  context:
    required: true
  image:
    required: true
  tag-latest:
    default: "false"
  registry-token:
    required: true

runs:
  using: composite
  steps:
    - id: token-owner
      shell: bash
      run: |
        set -euo pipefail
        JSON="$(curl -fsSL \
          -H "Authorization: token ${{ inputs.registry-token }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/user)"
        USERNAME="$(printf '%s' "$JSON" | jq -r '.login // empty')"
        if [ -z "$USERNAME" ]; then
          echo "::error::Unable to resolve GHCR username from registry token"
          exit 1
        fi
        echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ steps.token-owner.outputs.username }}
        password: ${{ inputs.registry-token }}

    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ github.sha }}

    - if: inputs.tag-latest == 'true'
      shell: bash
      run: |
        IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}"
        docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
        docker push "${IMAGE}:latest"
