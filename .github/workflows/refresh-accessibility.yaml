# Refreshes the vehicle accessibility dataset (openspec/changes/ramp-vehicle-
# accessibility) and commits it into the fleet repo as a plain ConfigMap;
# Flux applies it from there like any other change, no in-cluster CronJob.

name: Refresh accessibility data

on:
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday ~03:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          working-directory: backend
      - run: bun run scripts/refresh-accessibility.ts /tmp/vehicle-accessibility.json
        working-directory: backend
      - uses: azure/setup-kubectl@v4

      - uses: actions/checkout@v4
        with:
          repository: rangelovkiril/fleet
          token: ${{ secrets.FLEET_REPO_TOKEN }}
          path: fleet

      - id: configmap
        working-directory: fleet
        run: |
          kubectl create configmap rampme-backend-accessibility-data \
            --from-file=vehicle-accessibility.json=/tmp/vehicle-accessibility.json \
            --namespace rampme \
            --dry-run=client -o yaml \
            > apps/rampme/backend/accessibility-refresh/configmap.yaml
          git diff --quiet -- apps/rampme/backend/accessibility-refresh/configmap.yaml \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.configmap.outputs.changed == 'true'
        working-directory: fleet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rampme/backend/accessibility-refresh/configmap.yaml
          git commit -m 'chore(rampme): refresh vehicle accessibility data'
          git push
