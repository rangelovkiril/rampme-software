# OpenSpec: validate change/spec structure on every PR and push to main
# that touches openspec/. Pinned to the version used locally; bump
# deliberately and re-verify, since the CLI is still labeled experimental.

name: OpenSpec

on:
  pull_request:
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yaml'
  push:
    branches: [main]
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yaml'

concurrency:
  group: openspec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bunx --bun @fission-ai/openspec@1.10.0 validate --all --strict
