name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - app: frontend
            build: true
          - app: backend
            build: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check
        with:
          app: ${{ matrix.app }}
          build: ${{ matrix.build }}

  e2e:
    name: Frontend end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile
      - name: Install Chromium
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: cd frontend && bun run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  build:
    name: Build ${{ matrix.app }}
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        with:
          context: ./${{ matrix.app }}
          image: hacktues12-${{ matrix.app }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          tag-latest: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
