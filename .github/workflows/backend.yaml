# Backend: check on every PR; on main, build the image once and push it as
# sha-<commit> + stage-<timestamp>, then promote that exact image to
# prod-<timestamp> without rebuilding. Flux watches prod-* tags
# (numerically ascending), so the timestamp format must stay sortable.

name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend.yaml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend.yaml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hacktues12-backend

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-backend-${{ hashFiles('backend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-backend-
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc --noEmit
      - run: bun test --coverage --coverage-reporter=text --reporter=junit --reporter-outfile=junit.xml
      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: backend/junit.xml
          check_name: Backend tests

  build-image:
    name: Build image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "stage=stage-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.stage }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  promote:
    name: Promote to production
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:prod-$(date -u +%Y%m%d%H%M%S)" "$IMAGE:sha-$GITHUB_SHA"
